<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
  <!-- Portal del centro del tablero (mismos colores y composición que Board.tsx) -->
  <defs>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5b3d8f"/>
      <stop offset="0.6" stop-color="#2a1d48"/>
      <stop offset="1" stop-color="#17112b"/>
    </radialGradient>
  </defs>
  <rect width="90" height="90" rx="16" fill="url(#portal)"/>
  <!-- anillo punteado -->
  <circle cx="45" cy="45" r="36" fill="none" stroke="#b27fe8" stroke-width="3" stroke-dasharray="7 6"/>
  <!-- seis rayos -->
  <g stroke="#d9b8ff" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="45" x2="78" y2="45"/>
    <line x1="54.5" y1="61.5" x2="61.5" y2="73.6"/>
    <line x1="35.5" y1="61.5" x2="28.5" y2="73.6"/>
    <line x1="26" y1="45" x2="12" y2="45"/>
    <line x1="35.5" y1="28.5" x2="28.5" y2="16.4"/>
    <line x1="54.5" y1="28.5" x2="61.5" y2="16.4"/>
  </g>
  <!-- núcleo oscuro con borde dorado -->
  <circle cx="45" cy="45" r="16" fill="#0b0816" stroke="#e8c468" stroke-width="3.5"/>
</svg>
